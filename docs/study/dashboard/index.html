<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="tokens.css">
<style>

<body>
<div id="dash-root">
<style>
  .g3 { --g3-sub: var(--color-fg-muted); position: relative; display: grid; gap: var(--gap-xl); font-family: var(--font-sans); color: var(--color-fg); max-width: 1480px; margin-inline: auto; min-width: 0; }
  .g3 .t-title { font-family: var(--font-serif); font-weight: 400; font-size: var(--font-size-title); margin: 0; text-wrap: balance; }

  .g3 .note { font-size: var(--font-size-body); line-height: 1.5; margin: 0; max-width: 86ch; opacity: .8; }

  .g3 .prog .grp { display: grid; gap: 4px; align-content: start; }
  .g3 .prog .items { display: flex; flex-wrap: wrap; gap: 4px; }
  .g3 .prog button { font: inherit; font-size: var(--font-size-caption); color: var(--color-fg); background: none; border: 0; border-radius: 4px; padding: 4px 4px 2px; min-height: 28px; cursor: pointer; display: grid; gap: 3px; min-width: 64px; text-align: left; }

  /* pickers */
  .g3 .ctl { display: flex; flex-wrap: wrap; gap: var(--gap-xs) var(--gap-lg); align-items: center; }
  .g3 .pills { display: flex; flex-wrap: wrap; gap: 4px var(--gap-md); align-items: center; }
  .g3 .pgrp { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .g3 .pgrp > .t-head { margin-right: 2px; }
  .g3 .pill { font: inherit; font-size: var(--font-size-caption); min-height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--color-border-line); background: none; color: var(--color-fg); cursor: pointer; white-space: nowrap; }
  .g3 .pill:hover { border-color: var(--color-fg-muted); }
  .g3 .pill[aria-pressed=true] { background: var(--color-fg); color: var(--color-bg); border-color: var(--color-fg); }

  .g3 label.sel { display: inline-flex; gap: 6px; align-items: center; font-size: var(--font-size-caption); }

  .g3 .score thead th { font-weight: 400; font-size: var(--font-size-caption); color: var(--g3-sub); border-bottom: 1px solid var(--color-border-line); vertical-align: bottom; }
  .g3 .score tbody tr.arm { cursor: pointer; border-bottom: 1px solid var(--color-border-line); }
  .g3 .score tbody tr.arm:hover { background: color-mix(in srgb, var(--chart-grid) 50%, transparent); }
  .g3 .score tbody tr.arm[aria-selected=true] { background: var(--color-panel); }
  .g3 .score tbody tr.arm[aria-selected=true] th { box-shadow: inset 2px 0 0 var(--color-fg); }
  .g3 .score tr.fam th { padding: 12px 0 2px; }
  .g3 .score .name { font-weight: var(--font-weight-medium); padding-left: 8px; position: sticky; left: 0; background: var(--color-bg); z-index: 1; }

  .g3 .c-better { color: var(--color-ok); } .g3 .c-worse { color: var(--color-bad); }
  .g3 .s-better { background: var(--color-ok); } .g3 .s-worse { background: var(--color-bad); } .g3 .s-tie { background: var(--color-fg-muted); } .g3 .s-open { background: var(--chart-muted); }

  .g3 .cfam { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px var(--gap-sm); margin: 0; align-items: center; font-size: var(--font-size-caption); }
  .g3 .cfam dt { color: var(--g3-sub); } .g3 .cfam dd { margin: 0; display: flex; gap: 8px; align-items: center; } .g3 .cfam .stack { margin: 0; }
  /* hub */

  .g3 .hubmain { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-sm); min-width: 0; }
  .g3 .frame { display: grid; grid-template-columns: max-content minmax(0, 1fr); min-width: 0; }

  .g3 .zoom { display: grid; gap: 0; }
  .g3 #g3-hub-plot.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
  .g3 .more-cue { margin: 0; text-align: right; font-size: var(--font-size-caption); color: var(--g3-sub); }
  .g3 .pane .verdict { font-size: var(--font-size-body); line-height: 1.45; margin: 0; }
  .g3 .read { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px var(--gap-md); font-size: var(--font-size-caption); font-variant-numeric: tabular-nums; margin: 0; }
  .g3 .read dt { color: var(--g3-sub); } .g3 .read dd { margin: 0; }
  .g3 .read.stacked { grid-template-columns: minmax(0, 1fr); gap: 0; } .g3 .read.stacked dd { margin-bottom: 4px; }
  .g3 .pane svg { display: block; overflow: visible; }
  .g3 details > summary { min-height: 24px; line-height: 24px; cursor: pointer; font-size: var(--font-size-caption); color: var(--g3-sub); width: max-content; max-width: 100%; }
  .g3 table.tbl { border-collapse: collapse; font-size: var(--font-size-caption); font-variant-numeric: tabular-nums; margin-top: var(--gap-xs); }
  .g3 .tbl th, .g3 .tbl td { padding: 3px 12px 3px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--color-border-line); }
  .g3 .tbl caption { text-align: left; color: var(--g3-sub); padding-bottom: 4px; }
  .g3 .tbl thead th { font-weight: 400; color: var(--g3-sub); }
  .g3 .tbl tbody th { font-weight: var(--font-weight-medium); }
  /* svg */
  .g3 svg text { fill: var(--color-fg); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  .g3 svg text.mut { fill: var(--g3-sub); }
  .g3 svg text.t-head { fill: var(--g3-sub); text-transform: none; }
  .g3 svg text.sub { fill: var(--color-fg); fill-opacity: .8; }
  .g3 svg .grid { stroke: var(--chart-grid); }
  .g3 svg .ref { stroke: var(--chart-reference); }
  .g3 svg .axis { stroke: var(--chart-axis); }
  .g3 svg .band { fill: var(--chart-grid); }
  .g3 svg .hl { fill: var(--chart-grid); fill-opacity: .55; }
  .g3 svg.small .gl.one { stroke-dasharray: none; }
  .g3 svg .rule { stroke: var(--color-border-line); }
  .g3 svg text.halo { paint-order: stroke; stroke: var(--color-bg); stroke-width: 3px; stroke-linejoin: round; }
  .g3 .gl.better { fill: var(--color-ok); } .g3 .gl.worse { fill: var(--color-bad); }
  .g3 .gl.tie { fill: none; stroke: var(--color-fg); stroke-width: 1.5; }
  .g3 .gl.open { fill: var(--color-bg); stroke: var(--color-fg-muted); stroke-width: 1.25; }
  .g3 .gl.one { fill: var(--color-bg); stroke: var(--color-fg-muted); stroke-width: 1.25; stroke-dasharray: 1.6 1.2; }
  .g3 .ivl { stroke-width: 2; stroke-opacity: .85; fill: none; }
  .g3 .cap { stroke-width: 1.5; fill: none; }
  .g3 .mt { stroke-width: 2; }
  .g3 .gh { fill: var(--color-bg); stroke: var(--color-bg); stroke-width: 3; stroke-linejoin: round; }
  .g3 .ivl.better, .g3 .cap.better, .g3 .mt.better { stroke: var(--color-ok); } .g3 .ivl.worse, .g3 .cap.worse, .g3 .mt.worse { stroke: var(--color-bad); }
  .g3 .ivl.tie, .g3 .cap.tie, .g3 .mt.tie { stroke: var(--color-fg); } .g3 .ivl.open, .g3 .ivl.one, .g3 .cap.open, .g3 .cap.one, .g3 .mt.open, .g3 .mt.one { stroke: var(--g3-sub); stroke-opacity: 1; }
  .g3 .seed { stroke: var(--color-fg-muted); stroke-width: 1; }
  .g3 .pk { fill: none; stroke: var(--color-fg); stroke-width: 1.25; }
  .g3 .pf.better { fill: var(--color-ok); stroke: var(--color-ok); } .g3 .pf.worse { fill: var(--color-bad); stroke: var(--color-bad); }
  .g3 .pf.tie { fill: var(--color-fg); stroke: var(--color-fg); }
  .g3 .pf.open, .g3 .pf.one { fill: var(--color-bg); stroke: var(--color-fg-muted); stroke-width: 1.25; } .g3 .pf.one { stroke-dasharray: 1.6 1.2; }
  .g3 .ring { fill: none; stroke: var(--color-fg); stroke-width: 1.25; }
  .g3 .leader { stroke: var(--color-fg-muted); stroke-width: .75; }
  .g3 .cell, .g3 .hdr { outline: none; cursor: pointer; }
  .g3 .cell .focus, .g3 .hdr .focus { fill: transparent; stroke: none; }
  .g3 .cell:hover .focus, .g3 .hdr:hover .focus { fill: var(--chart-grid); }
  .g3 .cell.sel .focus { stroke: var(--color-fg); stroke-width: 1; }
  .g3 .cell:focus-visible .focus, .g3 .hdr:focus-visible .focus { stroke: var(--color-fg); stroke-width: 2; }
  .g3 .dim { opacity: .25; }
  /* plane */
  .g3 .planebox { position: relative; min-width: 0; }
  .g3 .mult { display: grid; gap: var(--gap-md) var(--gap-lg); }
  .g3 .mult figure { margin: 0; display: grid; gap: 2px; min-width: 0; }
  .g3 .mult figcaption button { font: inherit; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); background: none; border: 0; padding: 4px 0; min-height: 28px; color: var(--color-fg); cursor: pointer; text-align: left; }
  .g3 .mult figcaption button[aria-pressed=true] { text-decoration: underline; text-underline-offset: 3px; }
  .g3 .mult figcaption .t-head { margin-left: 6px; }
  /* tooltip */
  .g3 .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface-popover); border: 1px solid var(--color-border-line); border-radius: var(--radius); box-shadow: var(--shadow-popover); padding: var(--pad-xs) var(--pad-sm); max-width: min(22rem, 90%); line-height: 1.45; font-variant-numeric: tabular-nums; }
  .g3 .tip .k { color: var(--color-fg-muted); }
  .g3 .tip .h { font-weight: var(--font-weight-medium); }

  .g3 .method-body { display: grid; gap: var(--gap-xs); padding-top: var(--gap-xs); }
  .g3 .gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: var(--gap-xl); }
  .g3 .gloss dl { display: grid; grid-template-columns: minmax(7rem, max-content) minmax(0, 1fr); gap: 4px var(--gap-md); font-size: var(--font-size-caption); margin: 0; align-content: start; line-height: 1.45; }
  .g3 .gloss dt { font-weight: var(--font-weight-medium); } .g3 .gloss dd { margin: 0; opacity: .8; }
  .g3 .gloss dt.fam { grid-column: 1 / -1; padding-top: 6px; }
  .g3 .tbl td.num { text-align: right; } .g3 .tbl thead th.num { text-align: right; }
  .g3 .tbl tr.grp th { padding-top: 12px; font-weight: var(--font-weight-medium); border-bottom: 0; white-space: normal; }
  .g3 .tbl.scale thead th { white-space: normal; vertical-align: bottom; min-width: 7ch; }
  .g3 .tbl.scale tbody th .tag { display: block; white-space: normal; max-width: 30ch; }

</style>

<div class="g3" id="g3">
  <header class="hd">
    <h1 class="t-title">Gossip study results</h1>
    <nav class="pills" id="g3-variant" aria-label="Which variant of each design the page shows"></nav>
    <p class="note" id="g3-variant-note"></p>
    <p class="status" id="g3-status" data-source="progress study"></p>
    <div class="prog" id="g3-prog" role="group" aria-label="Runs completed per regime; choose one to select it" data-source="regime_progress"></div>
  </header>

  <section class="sec" aria-labelledby="g3-score-title">
    <h2 id="g3-score-title">Where each arm stands against main</h2>

    <div id="g3-score" data-source="scorecard family_tally"></div>
  </section>

  <section class="sec" id="g3-hub-sec" aria-labelledby="g3-hub-title">

      <label class="sel">Count as a tie within <select id="g3-rope" data-fk="rope"></select></label>

    <div class="key" id="g3-key"></div>

      <div class="hubmain">

        <details><summary>Show as table</summary><div class="scroll" id="g3-hub-table" data-source="verdicts"></div></details>

      <aside class="pane" id="g3-pane" aria-live="polite" data-source="verdicts seeds"></aside>
    </div>

  <section class="sec" aria-labelledby="g3-super-title">

    <nav class="pills" id="g3-fam" aria-label="Metric family"></nav>

    <div id="g3-super" data-source="verdicts main_range"></div>

  </section>

  <section class="sec" aria-labelledby="g3-plane-title">
    <h2 id="g3-plane-title"></h2>

    <div class="ctl" id="g3-plane-ctl"></div>
    <div class="key" id="g3-plane-key"></div>

  <section class="sec" aria-labelledby="g3-scale-title">
    <h2 id="g3-scale-title">Beyond the autoscaler maximum</h2>

  </details>

  <div class="gloss">
    <section class="sec"><h2>Arms</h2><dl id="g3-arms" data-source="arms"></dl></section>

</div>

<script>
(() => {
  /* ---------- Study constants (the calcs close over these) ---------- */
  const BASELINE_ARM = 'main';
  const REFERENCE_ARM = 'local-only';            // sends nothing: shown, never counted
  const BYTES_METRIC = 'bytes_total';
  const NEVER_METRIC = 'conv_never_frac';
  const CREDIBLE_LEVEL = 0.95;                    // level of every interval the judge reports
  const MIN_SEEDS = 2;                            // valid seeds needed on both sides to settle
  const DEFAULT_SEEDS = 3;                        // seeds planned per arm and regime
  const ROPES = [0.01, 0.05, 0.10, 0.25];         // tie-band choices
  const DEFAULT_ROPE = 0.05;
  // Compact intervals print ±x % while the half-width is at most this, beyond it the two ends; both to 2 significant figures.
  const COMPACT_PM_MAX = 0.5;
  // Convergence quantiles that count never-converged hits as their remaining life.
  const CENSOR_QUANTILE = { conv_p50_incl_never_ms: 0.5, conv_p99_incl_never_ms: 0.99 };

  // Every design comes in up to three variants; arms.json names each variant's solution in a column of that name.
  const VARIANTS = ['baseline', 'improved', 'improved_nopk'];
  const BASELINE_VARIANT = VARIANTS[0];
  const SELF_COMPARISON = 'vs_own_baseline', PERKEY_COMPARISON = 'perkey_effect';   // the self_posterior comparisons
  const ropeKey = (r) => 'v' + Math.round(r * 100);
  const toNum = (x) => (x === null || x === undefined || x === '' ? null : Number(x));
  const isValid = (v) => v === true || v === 'true';

  /* ---------- Calcs ---------- */
  dash.calc('study', {
    title: 'Study constants',
    description: 'The credible level of every interval the judge reports, the widest half-width written as ±x % in compact text (wider intervals print their ends), the valid seeds a comparison needs on both sides before it can settle, and the seeds planned per arm and regime (the most seen so far, at least the design\'s three).',
    inputs: ['runs'],
    fn: (runs) => [{ credible_level: CREDIBLE_LEVEL, min_seeds: MIN_SEEDS, compact_pm_max: COMPACT_PM_MAX, seeds: Math.max(DEFAULT_SEEDS, d3.max(runs, (r) => toNum(r.seed)) ?? 0) }],
  });

  dash.calc('solutions', {
    title: 'Solutions per arm and variant',
    description: 'Every simulated solution: the arm (row) it belongs to and its variant: baseline (the arm itself), improved, or improved_nopk, from the columns of those names in the arm table. A variant an arm does not have is simply absent.',
    inputs: ['arms'],
    fn: (arms) => arms.flatMap((a) => VARIANTS.map((v) => ({ solution: v === BASELINE_VARIANT ? a.arm : a[v], arm: a.arm, variant: v })).filter((r) => r.solution)),
  });

  dash.calc('progress', {
    title: 'Runs completed',
    description: 'Runs written so far and how many are invalid, in total and for the baseline and improved stages; runs planned (solutions × regimes × seeds); regimes in which every solution has at least the minimum valid seeds; regimes with no runs; and when the newest run finished.',
    inputs: ['runs', 'solutions', 'regimes', 'study'],
    fn: (runs, solutions, regimes, study) => {
      const { seeds, min_seeds: need } = study[0];
      const variantOf = new Map(solutions.map((r) => [r.solution, r.variant]));
      const isBase = (sol) => variantOf.get(sol) === BASELINE_VARIANT;
      const valid = runs.filter((r) => isValid(r.valid));
      const per = d3.rollup(valid, (v) => v.length, (r) => r.regime, (r) => r.arm);
      const any = new Set(runs.map((r) => r.regime));
      const stamps = runs.map((r) => r.run_at).filter(Boolean).sort();
      const baseSols = solutions.filter((r) => r.variant === BASELINE_VARIANT).length;
      return [{
        done: runs.length, invalid: runs.length - valid.length, planned: solutions.length * regimes.length * seeds,
        baseline_done: runs.filter((r) => isBase(r.arm)).length, baseline_planned: baseSols * regimes.length * seeds,
        improved_done: runs.filter((r) => !isBase(r.arm)).length, improved_planned: (solutions.length - baseSols) * regimes.length * seeds,
        regimes: regimes.length, empty: regimes.filter((g) => !any.has(g.regime)).length,
        settled: regimes.filter((g) => solutions.every((r) => (per.get(g.regime)?.get(r.solution) ?? 0) >= need)).length,
        run_at: stamps.length ? stamps[stamps.length - 1] : null,
      }];
    },
  });

  dash.calc('regime_progress', {
    title: 'Runs per regime',
    description: 'Runs written and planned (solutions × seeds) for each regime, every variant included.',
    inputs: ['runs', 'solutions', 'regimes', 'study'],
    fn: (runs, solutions, regimes, study) => {
      const done = d3.rollup(runs, (v) => v.length, (r) => r.regime);
      return regimes.map((g) => ({ regime: g.regime, done: done.get(g.regime) ?? 0, planned: solutions.length * study[0].seeds }));
    },
  });

  // Classifies posterior rows against their baseline rows: `baseOf(r)` names the baseline solution of row r, looked up in
  // `posterior` for the same regime and metric. The baseline side keeps the main_* field names.
  const judge = (rows, posterior, baseOf) => {
    const byKey = new Map(posterior.map((r) => [r.solution + '|' + r.regime + '|' + r.metric, r]));
    const never = new Map(posterior.filter((r) => r.metric === NEVER_METRIC).map((r) => [r.regime + '|' + r.solution, toNum(r.mean)]));
    const censored = (regime, sol, metric) => {
      const q = CENSOR_QUANTILE[metric], f = never.get(regime + '|' + sol);
      return q !== undefined && f !== null && f !== undefined && f > 1 - q;
    };
    const floor0 = (x) => (x === null ? null : Math.max(0, x));
    return rows.map((r) => {
      const base = baseOf(r), m = byKey.get(base + '|' + r.regime + '|' + r.metric);
      const mean = toNum(r.mean), mm = m ? toNum(m.mean) : null;
      const n = toNum(r.n_valid) ?? 0, mn = m ? toNum(m.n_valid) ?? 0 : 0;
      const kind = mean === null || mm === null ? 'na' : mean === 0 && mm === 0 ? 'same' : mean === 0 ? 'zero' : mm === 0 ? 'mainzero' : 'ratio';
      const ratio = kind === 'ratio' ? toNum(r.ratio) ?? mean / mm : kind === 'same' ? 1 : kind === 'zero' ? 0 : null;
      const paired = n >= MIN_SEEDS && mn >= MIN_SEEDS;
      const exact = paired && r.scale === 'log' && toNum(r.ratio_lo) === null && ratio !== null;
      const lo = exact ? ratio : toNum(r.ratio_lo), hi = exact ? ratio : toNum(r.ratio_hi);
      const dlo = toNum(r.diff_lo), dhi = toNum(r.diff_hi);
      const verdictAt = (rope) => {
        if (kind === 'na') return 'na';
        if (!paired) return 'one';
        if (kind === 'same') return 'tie';
        if (r.scale === 'log' && lo !== null) {
          const a = 1 / (1 + rope), b = 1 + rope;
          return hi < a ? 'better' : lo > b ? 'worse' : lo >= a && hi <= b ? 'tie' : 'open';
        }
        if (r.scale === 'diff' && dlo !== null) return dhi < 0 ? 'better' : dlo > 0 ? 'worse' : 'open';
        return 'open';
      };
      const row = {
        regime: r.regime, arm: r.solution, against: base, metric: r.metric, kind, scale: r.scale || null, paired, exact, n, main_n: mn, n_total: toNum(r.n_total) ?? n,
        mean, cri_lo: floor0(toNum(r.cri_lo)), cri_hi: toNum(r.cri_hi), zero_all: toNum(r.max) === 0,
        main_mean: mm, main_lo: m ? floor0(toNum(m.cri_lo)) : null, main_hi: m ? toNum(m.cri_hi) : null, main_zero_all: m ? toNum(m.max) === 0 : false,
        main_missing: mean !== null && mm === null, main_runs: m ? toNum(m.n_total) ?? 0 : 0,
        ratio, ratio_lo: r.scale === 'log' ? lo : null, ratio_hi: r.scale === 'log' ? hi : null,
        diff_mean: toNum(r.diff_mean), diff_lo: dlo, diff_hi: dhi, p_better: toNum(r.p_better),
        censored: censored(r.regime, r.solution, r.metric), main_censored: censored(r.regime, base, r.metric),
        never_frac: CENSOR_QUANTILE[r.metric] !== undefined ? never.get(r.regime + '|' + r.solution) ?? null : null,
      };
      for (const rope of ROPES) row[ropeKey(rope)] = verdictAt(rope);
      return row;
    });
  };

  dash.calc('verdicts', {
    title: 'Each arm against main, classified',
    description: 'Joins each arm\'s posterior row to main\'s for the same regime and metric. kind: ratio (both positive), zero (arm 0, main > 0), mainzero (main 0, arm > 0), same (both 0), na (either side unmeasured). Columns v1, v5, v10 and v25 give the verdict for a tie band r of 1, 5, 10 and 25 %: fewer than two valid seeds on either side is "one"; on the log scale better when the whole ratio interval is below 1/(1+r), worse when above 1+r, tie when inside [1/(1+r), 1+r], open otherwise; on the difference scale better when the difference interval is below 0, worse when above 0, open otherwise; both zero is a tie. When every paired seed gives the same ratio the interval collapses to it. main_missing marks an arm with a value where main has none in its runs (for example, no main seed healed). Credible intervals of the means are clamped at 0 (every metric is non-negative); zero_all marks a side that is 0 in every seed. censored marks a convergence quantile that falls on a never-converged hit (more than 1 − q of hits never converged), so its value is a lower bound.',
    inputs: ['posterior'],
    fn: (posterior) => judge(posterior.filter((r) => r.solution !== BASELINE_ARM), posterior, () => BASELINE_ARM),
  });

  dash.calc('self_verdicts', {
    title: 'Each improved solution against its own baseline, classified',
    description: 'The same classification as the verdicts table, for the judge\'s second set of paired posteriors: comparison vs_own_baseline pairs each improved solution with its own design\'s baseline (against), and perkey_effect pairs the improved solution with its no-per-key twin, isolating the per-key fix. The baseline side (main_* columns) is the against solution\'s own posterior row.',
    inputs: ['self_posterior', 'posterior'],
    fn: (self, posterior) => {
      const cmp = new Map(self.map((r) => [r.solution + '|' + r.regime + '|' + r.metric + '|' + r.against, r.comparison]));
      return judge(self, posterior, (r) => r.against).map((row) => ({ ...row, comparison: cmp.get(row.arm + '|' + row.regime + '|' + row.metric + '|' + row.against) }));
    },
  });

  dash.calc('self_scorecard', {
    title: 'Each improved solution against its own baseline, summarised',
    description: 'For each improved solution and tie band, against its own design\'s baseline: the median bytes ratio over regimes whose comparison has an interval (with how many), and how many error-metric comparisons are better or worse.',
    inputs: ['self_verdicts', 'metrics'],
    fn: (self, metrics) => {
      const isError = new Set(metrics.filter((x) => isValid(x.error)).map((x) => x.metric));
      return d3.groups(self.filter((c) => c.comparison === SELF_COMPARISON), (c) => c.arm).flatMap(([arm, cells]) => {
        const bytes = cells.filter((c) => c.metric === BYTES_METRIC && c.paired && c.ratio_lo !== null);
        return ROPES.map((rope) => {
          const err = cells.filter((c) => isError.has(c.metric) && c.kind !== 'na');
          return { arm, rope, bytes_ratio: bytes.length ? d3.median(bytes, (c) => c.ratio) : null, bytes_regimes: bytes.length,
            better: err.filter((c) => c[ropeKey(rope)] === 'better').length, worse: err.filter((c) => c[ropeKey(rope)] === 'worse').length };
        });
      });
    },
  });

  dash.calc('seed_ratios', {
    title: 'Per-seed ratio to main',
    description: 'For each arm, regime, metric and seed where both values are valid and positive, the arm value divided by main\'s on the same seed: the pairing the judge uses.',
    inputs: ['seeds'],
    fn: (seeds) => {
      const main = new Map(seeds.filter((s) => s.arm === BASELINE_ARM && isValid(s.valid)).map((s) => [s.regime + '|' + s.metric + '|' + s.seed, toNum(s.value)]));
      return seeds.filter((s) => s.arm !== BASELINE_ARM && isValid(s.valid)).flatMap((s) => {
        const mv = main.get(s.regime + '|' + s.metric + '|' + s.seed), v = toNum(s.value);
        return mv > 0 && v > 0 ? [{ regime: s.regime, arm: s.arm, metric: s.metric, seed: s.seed, ratio: v / mv }] : [];
      });
    },
  });

  const tallyBy = (verdicts, keyOf, base) => {
    const out = new Map();
    for (const c of verdicts) {
      if (c.arm === REFERENCE_ARM || c.kind === 'na') continue;
      const k0 = keyOf(c); if (k0 === null) continue;
      for (const rope of ROPES) {
        const k = k0 + '|' + rope;
        const t = out.get(k) || { ...base(c), rope, better: 0, tie: 0, worse: 0, open: 0, one: 0 };
        t[c[ropeKey(rope)]] += 1;
        out.set(k, t);
      }
    }
    return [...out.values()];
  };

  dash.calc('family_tally', {
    title: 'Verdicts per arm and metric family',
    description: 'For each arm (local only excluded), metric family other than cost, and tie band: how many regime × metric cells are better, tie, worse, open, or have one seed.',
    inputs: ['verdicts', 'metrics'],
    fn: (verdicts, metrics) => {
      const fam = new Map(metrics.map((m) => [m.metric, m.group]));
      const cost = fam.get(BYTES_METRIC);
      return tallyBy(verdicts, (c) => (fam.get(c.metric) === cost ? null : c.arm + '|' + fam.get(c.metric)), (c) => ({ arm: c.arm, family: fam.get(c.metric) }));
    },
  });

  dash.calc('metric_tally', {
    title: 'Verdicts per metric and variant',
    description: 'For each variant, metric and tie band: how many arm × regime comparisons with baseline main (local only excluded) are better, tie, worse, open, or have one seed.',
    inputs: ['verdicts', 'solutions'],
    fn: (verdicts, solutions) => {
      const variantOf = new Map(solutions.map((r) => [r.solution, r.variant]));
      return tallyBy(verdicts, (c) => (variantOf.has(c.arm) ? variantOf.get(c.arm) + '|' + c.metric : null), (c) => ({ variant: variantOf.get(c.arm), metric: c.metric }));
    },
  });

  dash.calc('interval_width', {
    title: 'Typical interval width per metric and variant',
    description: 'For each variant and metric, the median half-width of the paired ratio interval (ratio_hi ÷ ratio − 1; the interval is symmetric on the log scale) over every arm-regime comparison with an interval, local only excluded.',
    inputs: ['verdicts', 'solutions'],
    fn: (verdicts, solutions) => {
      const variantOf = new Map(solutions.map((r) => [r.solution, r.variant]));
      return d3.rollups(verdicts.filter((c) => c.arm !== REFERENCE_ARM && variantOf.has(c.arm) && c.ratio_lo !== null && !c.exact && c.ratio > 0), (v) => ({ median_half_width: d3.median(v, (c) => c.ratio_hi / c.ratio - 1), intervals: v.length }), (c) => variantOf.get(c.arm), (c) => c.metric)
        .flatMap(([variant, ms]) => ms.map(([metric, o]) => ({ variant, metric, ...o })));
    },
  });

  dash.calc('scorecard', {
    title: 'Bytes and worst loss per arm',
    description: 'For each arm (local only excluded) and tie band: the median, smallest and largest bytes ratio to main over regimes where that comparison has an interval; the number of settled losses over all metrics; and the worst settled loss (a loss against main at 0 ranks first, then the largest ratio), with its interval.',
    inputs: ['verdicts'],
    fn: (verdicts) => {
      const byArm = d3.group(verdicts.filter((c) => c.arm !== REFERENCE_ARM), (c) => c.arm);
      const out = [];
      for (const [arm, cells] of byArm) {
        const bytes = cells.filter((c) => c.metric === BYTES_METRIC && c.paired && c.ratio_lo !== null);
        for (const rope of ROPES) {
          const lost = cells.filter((c) => c[ropeKey(rope)] === 'worse');
          const worst = d3.greatest(lost, (c) => (c.kind === 'mainzero' ? Infinity : c.ratio));
          out.push({
            arm, rope, losses: lost.length,
            bytes_ratio: bytes.length ? d3.median(bytes, (c) => c.ratio) : null, bytes_min: d3.min(bytes, (c) => c.ratio) ?? null,
            bytes_max: d3.max(bytes, (c) => c.ratio) ?? null, bytes_regimes: bytes.length,
            worst_metric: worst?.metric ?? null, worst_regime: worst?.regime ?? null, worst_kind: worst?.kind ?? null,
            worst_ratio: worst?.ratio ?? null, worst_lo: worst?.ratio_lo ?? null, worst_hi: worst?.ratio_hi ?? null, worst_mean: worst?.mean ?? null,
          });
        }
      }
      return out;
    },
  });

  dash.calc('main_range', {
    title: 'Main\'s range per metric',
    description: 'Smallest and largest posterior mean of main across the regimes that measure each metric.',
    inputs: ['posterior'],
    fn: (posterior) => d3.rollups(posterior.filter((r) => r.solution === BASELINE_ARM && toNum(r.mean) !== null), (v) => ({ lo: d3.min(v, (r) => toNum(r.mean)), hi: d3.max(v, (r) => toNum(r.mean)), regimes: v.length }), (r) => r.metric).map(([metric, o]) => ({ metric, ...o })),
  });

  /* ---------- View ---------- */
  const root = document.getElementById('g3');
  const $ = (id) => document.getElementById(id);

  // Geometry, px. Font sizes come from the cds tokens through the t-* classes.
  const PHONE_MAX = 640;            // narrower: the hub draws the glyph-only verdict matrix
  const PANE_SIDE_MIN = 1200;       // wider: the detail pane sits beside the hub graphic
  const PANE_W = 340;
  const MIN_TARGET = 24;              // smallest pointer target, px
  const SCORE_CARDS_BELOW = 960;
  const HUB_GAP = 20;
  const SUB_NAME_DY = -1, SUB_DY = 10;   // a row name over its variant sub-label
  const ROW_H = 28, FAM_H = 20, GROUP_H = 18, LINE_H = 16, LABEL_PAD = 12;
  const TEXT_INSET = 1;   // left-anchored svg text starts here, not at 0: a T or V overhangs its origin and the svg clips it
  const STRIP_PITCH = 11, STRIP_GLYPH = 26, KEY_GLYPH = 40, TIE_MIN_W = 5, TIE_MIN_GAP = 2;
  const FOREST_COL_MIN = 128, FOREST_COL_MAX = 240, COL_PAD = 10, LANE_W = 16, LANE_GAP = 4, TICK_GAP = 6, NOT_RUN_CLEAR = 10;
  // A forest cell, top to bottom: verdict mark, interval (line, caps) with the mean tick, seed rail.
  const MARKER = 20, MARK_HALF = 3, MARK_DY = -8, TICK_H = 9, CAP_LEN = 6, SEED_DY = 7, SEED_LEN = 4, NARROW_PX = 6, NOTE_MARGIN = 3, NOTE_DY = 3, NOTE2_DY = [-2, 9];
  const MATRIX_COL_MIN = 24, MATRIX_COL_MAX = 30, MATRIX_GLYPH = 56;
  const DEC_MIN = -4, DEC_MAX = 3;
  const FIT_Q = 0.05, FIT_REACH = 0.15, FIT_PAD = 0.08, FIT_MIN_SPAN = 0.04, RATIO_TICKS = 4;   // forest axis fit, in decades
  const ST_SLOT = 8, ST_GROUP_GAP = 6, ST_PAD = 4, ST_H = 44, ST_DEC = 2, ST_COL_GAP = 14, ST_ROW_GAP = 6, ST_FAM_H = 16, ST_GLYPH = 20, ST_KEY_SCALE = 1.3;
  const PLANE_MIN_SPAN = 0.6, PLANE_PAD = 0.08;     // decades
  const MAIN_LABEL = 'main (×1, ×1)';
  const PLANE_MAX_W = 1040, PLANE_ASPECT = 0.56, PLANE_MIN_H = 320, PLANE_MAX_H = 540, PLANE_GLYPH = 64;
  const PANEL_MIN_W = 240, PANEL_H = 210, PANEL_GAP = 20, HOVER_R = 28, LEADER_GUTTER = 18, GUTTER_MAX_FRAC = 0.3, TINT_MAX_FRAC = 0.5, LABEL_NEAR = 9, LABEL_FAR = 26, LABEL_SPACE = 4;
  const PANE_BELOW_MAX = 640;
  const ZOOM_H = 40, ZOOM_BAR_Y = 12, ZOOM_INSET = 6, ZOOM_PAD = 0.35, ZOOM_MIN_REL = 0.01, ZOOM_TICKS = 4;
  const INTEGER_UNITS = new Set(['datagrams', 'slots']);
  const RESIZE_DEBOUNCE_MS = 120, AGE_REFRESH_MS = 60000;

  const STATES = ['better', 'tie', 'worse', 'open', 'one'];
  const VARIANT_LABEL = { baseline: 'Baseline', improved: 'Improved', improved_nopk: 'Improved, no per-key fix' };
  const VARIANT_SUB = { improved: 'improved', improved_nopk: 'improved, no per-key' };
  const VARIANT_PHRASE = { baseline: 'the baseline designs', improved: 'the improved designs', improved_nopk: 'the improved designs without the per-key fix' };
  const VARIANT_NOTE = {
    baseline: 'Each design as first built, against baseline main.',
    improved: 'Each design with every stage-4 fix, the per-key threshold fix included, still against baseline main; so Main is a row here: improved main against baseline main.',
    improved_nopk: 'The same stage-4 fixes without the per-key threshold fix, still against baseline main; so Main is a row here: improved main against baseline main.',
  };
  const WORD = { better: 'better than main', worse: 'worse than main', tie: 'a tie with main', open: 'not settled', one: 'one seed: cannot settle', none: 'not run yet', na: 'not measured' };
  const KEY_WORD = { better: 'better', tie: 'tie', worse: 'worse', open: 'not settled', one: 'one seed, no interval yet' };

  /* formatting */
  const NBSP = '\u00a0';
  const gen = (v) => (Math.abs(v) >= 1e4 ? d3.format('.3~s')(v) : d3.format(',.3~r')(v));
  const fmtBytes = (v) => { for (const [k, s] of [[1e12, 'TB'], [1e9, 'GB'], [1e6, 'MB'], [1e3, 'kB']]) if (Math.abs(v) >= k) return d3.format('.3~r')(v / k) + ' ' + s; return d3.format('.3~r')(v) + ' B'; };
  const fmtVal = (unit) => (v) => {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    if (unit === 'bytes') return fmtBytes(v);
    if (unit === 'ms') return Math.abs(v) >= 1000 ? gen(v / 1000) + ' s' : gen(v) + ' ms';
    if (unit === 'fraction') return d3.format('.2~r')(v * 100) + NBSP + '%';
    if (unit === '% of limit') return gen(v) + NBSP + '%';
    return gen(v) + ' ' + unit;
  };
  // Both ends of a range. Units whose formatter picks a suffix per value keep it on both ends; the rest carry it once.
  const PER_VALUE_SUFFIX = new Set(['bytes', 'ms', 'fraction']);
  const fmtRange = (unit, lo, hi) => (PER_VALUE_SUFFIX.has(unit) ? [fmtVal(unit)(lo), fmtVal(unit)(hi)] : [gen(lo), fmtVal(unit)(hi)]);
  const fmtR = (r) => (r === null || r === undefined || !isFinite(r) ? '—' : r === 0 ? '0' : r >= 1000 ? d3.format('.2~s')(r) : d3.format(r >= 1 ? '.3~r' : '.2~r')(r));
  const fmtRatio = (r) => (r === null || r === undefined || !isFinite(r) ? '—' : '×' + fmtR(r));
  const fmtP = (p) => (p === null ? '—' : p > 0.999 ? '> 0.999' : p < 0.001 ? '< 0.001' : d3.format('.3f')(p));
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  const fmtDec = (e) => (Math.abs(e) <= 2 ? '×' + +(10 ** e).toPrecision(1) : '×10' + String(e).split('').map((ch) => SUP[ch]).join(''));
  const fmtAge = (ms) => { const min = Math.floor(ms / 60000); if (min < 1) return 'less than a minute ago'; if (min < 90) return `${min} min ago`; const h = Math.round(min / 60); return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`; };
  const plural = (n, one, many) => (n === 1 ? one : many);
  // Half-width of a paired ratio interval as a fraction of the ratio (symmetric on the log scale).
  const halfWidth = (c) => (c.ratio_lo !== null && c.ratio_hi !== null && c.ratio > 0 ? c.ratio_hi / c.ratio - 1 : null);

  /* dom */
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    e.append(...kids.filter((k) => k !== null && k !== undefined && k !== false));
    return e;
  };
  const where = (o) => Object.entries(o).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const val = (text, source, field, w) => el('span', { 'data-source': source, 'data-field': field, 'data-where': w }, text);
  const mk = (sel, source, field, w) => sel.attr('data-source', source).attr('data-field', field).attr('data-where', w ?? null);
  const cellWhere = (c) => where({ arm: c.arm, regime: c.regime, metric: c.metric });
  const pill = (label, pressed, fk, onclick, title) => el('button', { type: 'button', class: 'pill', 'aria-pressed': String(pressed), 'data-fk': fk, title, onclick }, label);
  const pillGroup = (name, kids) => el('span', { class: 'pgrp', role: 'group', 'aria-label': name }, el('span', { class: 't-head' }, name), ...kids);

  /* Intervals are written two ways, one per context:
     full    (pane, tooltips, table, aria): mean [lo, hi] unit, all three at one scale and one precision;
     compact (forest, scorecard, notes):    ×r ±x %, the half-width of the log-symmetric ratio interval to 2 significant figures. */

    el('span', { class: 'c-better' }, '▼', val(String(t.better), 'family_tally', 'better', tw)), ' =', val(String(t.tie), 'family_tally', 'tie', tw), ' ',

    });
    const headRow = over.append('g').attr('role', 'row');

    present.forEach((g, j) => {

      if (selCol) under.insert('rect', ':first-child').attr('class', 'hl').attr('x', x0).attr('y', GROUP_H).attr('width', colW).attr('height', H - GROUP_H);
      const hd = headRow.append('g').attr('class', 'hdr').attr('role', 'columnheader').attr('tabindex', 0).attr('data-fk', 'hubh|' + g.regime).attr('aria-label', `${g.regime}: select this regime`)
        .on('click', () => dash.setParams({ regime: g.regime })).on('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dash.setParams({ regime: g.regime }); } });
      hd.append('title').text(g.description);
      if (phone) {
        hd.append('rect').attr('class', 'focus').attr('x', x0).attr('y', GROUP_H).attr('width', colW).attr('height', headH - GROUP_H).attr('rx', 3);
        hd.append('text').attr('class', 't-cap').attr('font-weight', selCol ? 600 : 500).attr('transform', `translate(${x0 + colW / 2 + 4},${headH - 6}) rotate(-90)`).text(g.regime);
      } else {
        const mainV = toNum(m.mainRow.get(g.regime + '|' + met.metric)?.mean), mw = where({ solution: BASELINE_ARM, regime: g.regime, metric: met.metric });
        hd.append('rect').attr('class', 'focus').attr('x', x0 + 2).attr('y', GROUP_H).attr('width', colW - 4).attr('height', 2 * LINE_H + 2).attr('rx', 3);
        hd.append('text').attr('class', 't-cap').attr('font-weight', selCol ? 600 : 500).attr('text-decoration', selCol ? 'underline' : null).attr('x', x0 + COL_PAD).attr('y', GROUP_H + LINE_H - 2).text(g.regime);

        if (mainV !== null) mk(hd.append('text').attr('class', 't-cap sub').attr('x', x0 + COL_PAD).attr('y', GROUP_H + 2 * LINE_H - 2).text(mainText), 'posterior', 'mean', mw);

        for (const t of ticks) under.append('line').attr('class', Math.abs(t) < 1e-9 ? 'ref' : 'grid').attr('x1', xs(t)).attr('x2', xs(t)).attr('y1', headH - 4).attr('y2', H);
        if (!ticks.some((t) => Math.abs(t) < 1e-9)) under.append('line').attr('class', 'ref').attr('x1', xs(0)).attr('x2', xs(0)).attr('y1', headH - 4).attr('y2', H);
        const ty = GROUP_H + 3 * LINE_H - 2, used = [];
        const label = (x, text) => {
          const w = textW(text, 't-cap'), b0 = Math.max(x0 + 2, Math.min(x0 + colW - 2 - w, x - w / 2));

        if (ticks.length) { label(xs(ticks[0]), '×' + fmtR(10 ** ticks[0])); label(xs(ticks[ticks.length - 1]), '×' + fmtR(10 ** ticks[ticks.length - 1])); }
        if (zl) label(xZero, '0');
        if (ml) label(xInf, '∞');
      }
      arms.forEach((a) => {
        if (!m.sol(a)) return;   // the row says why once, below
        const y = lay.ys.get(a.arm), cy = y + ROW_H / 2, c = m.cellOf(a.arm, g.regime, met.metric), st = stateOf(m, c);
        const key = `hub|${a.arm}|${g.regime}`, sel = a.arm === selArm && selCol;
        const cell = rows.get(a.arm).append('g').attr('class', 'cell' + (sel ? ' sel' : '')).attr('role', 'gridcell').attr('data-rc', `${m.contenders.indexOf(a)},${j}`).attr('data-fk', key)
          .attr('data-arm', a.arm).attr('data-regime', g.regime).attr('aria-selected', String(sel)).attr('aria-label', cellLabel(m, a, g, c)).attr('aria-description', selfText(m, c)).attr('tabindex', key === activeKey ? 0 : -1);
        const inset = phone ? 0 : 2;   // phone cells use their full width to stay a usable target
        cell.append('rect').attr('class', 'focus').attr('x', x0 + inset).attr('y', y + 1).attr('width', colW - 2 * inset).attr('height', ROW_H - 2).attr('rx', 3);
        cell.on('click', () => dash.setParams({ arm: a.arm, regime: g.regime }))
          .on('mouseenter focus', function () { cellTip(m, a, g, c, this); }).on('mouseleave blur', hideTip);
        if (!c) {
          const cx = x0 + colW / 2, clash = !phone && Math.abs(cx - xs(0)) < NOT_RUN_CLEAR;
          cell.append('text').attr('class', 't-cap sub').attr('x', clash ? xs(0) + NOT_RUN_CLEAR : cx).attr('y', cy + 4).attr('text-anchor', 'middle').text('–');
          return;
        }
        if (c.kind === 'na') return;
        if (phone) { glyph(cell, st, x0 + colW / 2, cy, MATRIX_GLYPH * Math.min(1, colW / MATRIX_COL_MAX)); return; }
        forestCell(cell, c, st, m.seedRatios.get(m.sol(a) + '|' + g.regime + '|' + met.metric) || [], { xs, lo, hi, x0, colW, cy, xZero, xInf, unit: met.unit });
      });
    });
    for (const a of arms.filter((x) => !m.sol(x))) lackingNote(over, m.reason(a), COL_PAD, lay.ys.get(a.arm) + ROW_H / 2, plotW - COL_PAD);
    if (!ps.select('.cell[tabindex="0"]').size()) ps.select('.cell').attr('tabindex', 0);
    rovingGrid(plotHost, (node) => dash.setParams({ arm: node.dataset.arm, regime: node.dataset.regime }));
    // when the regimes overflow, say so and fade the cut edge until the end is reached
    cue.hidden = plotW <= avail;
    plotHost.scrollLeft = scrollLeft;
    const edge = () => plotHost.classList.toggle('more', plotHost.scrollLeft + plotHost.clientWidth < plotHost.scrollWidth - 2);
    plotHost.onscroll = edge; edge();
    drawPane(m, present);
    drawHubTable(m, present);
  };

  const drawHubTable = (m, present) => {
    const cols = m.regimes.filter((g) => present.includes(g) || absentReason(m, g) === 'mainmissing'), unit = m.metric.unit;
    $('g3-hub-table').replaceChildren(el('table', { class: 'tbl' },
      el('caption', {}, `${m.metric.label}: ratio to main with its `, val(levelText(m), 'study', 'credible_level'), ` credible interval, and the verdict at ${ropeText(m)}.`),
      el('thead', {}, el('tr', {}, el('th', {}, 'Arm'), ...cols.map((g) => el('th', { scope: 'col' }, g.regime)))),
      el('tbody', {}, ...m.arms.map((a) => el('tr', {}, el('th', { scope: 'row', 'data-arm': a.arm }, rowName(m, a)), ...(!m.sol(a) ? [el('td', { class: 'muted', colspan: String(cols.length) }, `— ${m.reason(a)}`)] : cols.map((g) => {
        const c = m.cellOf(a.arm, g.regime, m.metric.metric);
        if (!c) return el('td', { class: 'muted' }, 'not run yet');
        if (c.main_missing) return el('td', {}, ...partsNodes(absParts(c, unit, 'mean', 'cri_lo', 'cri_hi', c.censored, c.zero_all), c), el('span', { class: 'muted' }, ' · main has no value'));
        if (c.kind === 'na') return el('td', { class: 'muted' }, 'not measured');
        const st = stateOf(m, c);
        return el('td', {}, c.censored ? '≥ ' : '', ...partsNodes(fullParts(c, unit), c), st === 'one' ? null : el('span', { class: 'muted' }, ' · ' + KEY_WORD[st]));
      })))))));
  };

  /* detail pane: regime, verdict sentence, the cell zoomed to scale, readout */

    const pane = $('g3-pane'), ps = getComputedStyle(pane);
    const width = Math.floor(pane.clientWidth - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight));
    const g = m.regime, met = m.metric, a = m.arm;
    const kids = [el('h3', {}, `${armTitle(m, a)} · ${met.short} · ${g.regime}`), el('p', { class: 'note t-cap' }, g.description)];
    const c = m.cellOf(a.arm, g.regime, met.metric);
    const say = (t) => el('p', { class: 'verdict' }, t);
    const why = present.includes(g) ? null : absentReason(m, g);
    if (!m.sol(a)) kids.push(say(`${rowName(m, a)} has no ${VARIANT_LABEL[m.variant].toLowerCase()} variant: ${m.reason(a)}.`));
    else if (why === 'notrun') kids.push(say(`No runs of ${VARIANT_PHRASE[m.variant]} in ${g.regime} yet. Nothing in this view speaks to it until they land.`));
    else if (why === 'mainmissing') kids.push(el('p', { class: 'verdict' }, ...mainMissingNote(m, g)));

  };

  // An improved variant paired against its own design: the judge's posterior against the design's baseline, and the per-key fix alone.
  const selfOf = (m, cmp, sol, c) => (sol ? m.self.get(cmp + '|' + sol + '|' + c.regime + '|' + c.metric) : undefined);
  const selfWhere = (sc) => where({ comparison: sc.comparison, arm: sc.arm, regime: sc.regime, metric: sc.metric });
  const selfBlock = (m, c) => {
    if (m.variant === BASELINE_VARIANT) return [];
    const unit = m.metric.unit, dl = el('dl', { class: 'read stacked' });
    const pairs = [[SELF_COMPARISON, c.arm, (sc) => `Against its own baseline (${sc.against})`, 'P(better than its baseline)'],

    for (const [cmp, sol, label, pLabel] of pairs) {
      const sc = selfOf(m, cmp, sol, c);

  const rowSub = (m, a) => (m.variant !== BASELINE_VARIANT && m.sol(a) ? VARIANT_SUB[m.variant] : null);
  const armTitle = (m, a) => (m.variant === BASELINE_VARIANT || !m.sol(a) ? rowName(m, a) : `${rowName(m, a)}, as ${m.sol(a)}`);
  const armShort = (m, a) => (m.variant === BASELINE_VARIANT ? a.name : m.sol(a));

  const readout = (m, c, width) => {
    const unit = m.metric.unit, st = stateOf(m, c), name = armShort(m, m.arm), w = cellWhere(c), lvl = () => val(levelText(m), 'study', 'credible_level'), band = ropeText(m);
    const diff = hasDiff(c);
    const sentence = {
      better: diff ? [`${name} beats main here: the whole `, lvl(), ' interval for the difference lies below zero.'] : [`${name} beats main here: the whole `, lvl(), ` interval for the ratio lies below the ${band} tie band.`],
      worse: diff ? [`${name} is worse than main here: the whole `, lvl(), ' interval for the difference lies above zero.'] : [`${name} is worse than main here: the whole `, lvl(), ` interval for the ratio lies above the ${band} tie band.`],
      tie: c.kind === 'same' ? [`${name} and main are both 0 in every seed.`] : c.exact ? [`Every paired seed gives ${name} the same ratio to main, inside the ${band} tie band.`] : [`${name} and main are within ${band} of each other: the whole `, lvl(), ' interval lies inside the tie band.'],

    }[st];

    out.push(dl, el('p', { class: 'note t-cap' }, 'Brackets are ', lvl(), ' credible intervals. Pairing by seed removes the spread the two arms share, so the ratio\'s interval can be much narrower than the two above suggest.'));

  };

  // One line of the zoom, on its own axis fitted to its interval and seeds so the interval fills a good share of it.
  const zoomRow = ({ width, label, mean, lo, hi, seeds, cls, unit, band, bandText }) => {

  };

  const zooms = (m, c, width) => {
    const unit = m.metric.unit, st = stateOf(m, c);

    const side = (label, mean, lo, hi, arm, cls, zero) => (zero ? el('p', { class: 'note t-cap' }, `${label}: 0 in every seed.`) : zoomRow({ width, label, mean, lo, hi, seeds: seeds(arm), cls, unit }));
    const out = [el('h3', { class: 't-cap muted' }, 'This cell to scale, each line on its own axis'),

  /* ---------- Supertable: every arm, every metric, every regime ---------- */
  const drawSuper = (m, fk) => {
    const host = $('g3-super'), arms = m.arms, regimes = m.regimes;
    const gi = (j) => m.groups.indexOf(regimes[j].group);
    const gaps = (m.groups.length - 1) * ST_GROUP_GAP;
    const yOf = (l) => ST_PAD + (ST_DEC - Math.max(-ST_DEC, Math.min(ST_DEC, l))) / (2 * ST_DEC) * (ST_H - 2 * ST_PAD);
    // metrics with no arm-to-main comparison yet go to one line under the table

    $('g3-super-none').replaceChildren(...(measured.length < m.metrics.length ? [el('b', {}, 'No arm can be compared with main yet on: '), m.metrics.filter((x) => !measured.includes(x)).map((x) => x.short).join(', ') + '.'] : []));
    const fams = d3.groups(measured, (x) => x.group), widest = d3.max(fams, ([, l]) => l.length);
    const range = new Map(m.get('main_range').map((r) => [r.metric, r]));
    const nameW = Math.ceil(d3.max(arms, (a) => textW(rowName(m, a), 't-body', a.arm === m.arm.arm ? 600 : null))) + LABEL_PAD;
    const keyTicks = [[ST_DEC, fmtDec(ST_DEC)], [0, '×1 = main'], [-ST_DEC, fmtDec(-ST_DEC)]];
    const keyTickW = d3.max(keyTicks, ([, t]) => textW(t, 't-cap'));
    // strip geometry for a slot width; the key is scaled until every group's name fits under its slots on one line,
    // and enlarged up to ST_KEY_SCALE only as far as the key, ticks included, still fits the page; where caption-size
    // names would push it past the page, they drop to the note size
    const geom = (slot) => {
      const slotX = (j) => ST_PAD + j * slot + gi(j) * ST_GROUP_GAP + slot / 2;
      const stripW = 2 * ST_PAD + regimes.length * slot + gaps;
      const spans = m.groups.map((grp) => { const js = regimes.map((r, j) => j).filter((j) => regimes[j].group === grp); return { grp, a: slotX(js[0]) - slot / 2, b: slotX(js[js.length - 1]) + slot / 2 }; });

      g.append('text').attr('class', 't-cap halo').attr('font-weight', p.a.arm === m.arm.arm ? 600 : null).attr('x', box.x0).attr('y', box.y0 + LINE_H - 3).text(rowName(m, p.a));
    }
    let gy = -Infinity;
    for (const p of (gutterOn ? lab.miss : []).slice().sort((a, b) => nodes.get(a).Y - nodes.get(b).Y)) {
      const { X, Y, g } = nodes.get(p), lx = G.plot.x1 + LEADER_GUTTER - 4, ly = Math.max(Y, gy + LINE_H);
      gy = ly;
      g.append('line').attr('class', 'leader').attr('x1', X + 6).attr('y1', Y).attr('x2', lx - 3).attr('y2', ly);
      g.append('text').attr('class', 't-cap halo').attr('font-weight', p.a.arm === m.arm.arm ? 600 : null).attr('x', lx).attr('y', ly + 4).text(rowName(m, p.a));
    }
    // hover and tap through a Delaunay of the points
    const delaunay = d3.Delaunay.from(pts, (p) => nodes.get(p).X, (p) => nodes.get(p).Y);
    const near = (e) => { const [qx, qy] = d3.pointer(e); const i = delaunay.find(qx, qy); const p = pts[i]; return p && Math.hypot(nodes.get(p).X - qx, nodes.get(p).Y - qy) <= HOVER_R ? p : null; };
    svg.append('rect').attr('width', w).attr('height', h).attr('fill', 'transparent')
      .on('pointermove', (e) => {
        const p = near(e);
        for (const [q, n] of nodes) n.g.classed('dim', !!p && q !== p);
        if (!p) return hideTip();
        const r = svg.node().getBoundingClientRect(), { X, Y } = nodes.get(p);
        showTip(new DOMRect(r.left + X - 6, r.top + Y - 6, 12, 12), `${armTitle(m, p.a)} · ${p.g.regime}`, [
          [xm.short, ...partsNodes(fullParts(p.bx, xm.unit), p.bx), ' · ' + KEY_WORD[stateOf(m, p.bx)]],
          [ym.short, p.by.censored ? '≥ ' : '', ...partsNodes(fullParts(p.by, ym.unit), p.by), ' · ' + KEY_WORD[stateOf(m, p.by)]],
          ['P(fewer bytes)', val(fmtP(p.bx.p_better), 'verdicts', 'p_better', cellWhere(p.bx))],
          ['P(lower error)', val(fmtP(p.by.p_better), 'verdicts', 'p_better', cellWhere(p.by))],
        ]);
      })
      .on('pointerleave', () => { hideTip(); for (const n of nodes.values()) n.g.classed('dim', false); })
      .on('click', (e) => { const p = near(e); if (p) dash.setParams({ arm: p.a.arm, regime: p.g.regime }); });
    return gutterOn ? [] : lab.miss;
  };

  const drawPlane = (m) => {
    const errs = m.metrics.filter((x) => isValid(x.error));
    const ym = errs.find((x) => x.metric === m.params.y) || errs[0];
    const xm = m.metrics.find((x) => x.metric === BYTES_METRIC);
    const all = m.params.plane === 'all';
    const pairOf = (a, g) => { const bx = m.cellOf(a.arm, g.regime, xm.metric), by = m.cellOf(a.arm, g.regime, ym.metric); return bx && by && bx.kind !== 'na' && by.kind !== 'na' ? { a, g, bx, by } : null; };
    const withData = m.regimes.filter((g) => m.live.some((a) => pairOf(a, g)));
    $('g3-plane-title').textContent = all ? `Bytes against ${ym.label.toLowerCase()}, regime by regime` : `Bytes against ${ym.label.toLowerCase()} in ${m.regime.regime}`;
    $('g3-plane-note').replaceChildren(`${xm.label} (across) against ${ym.label.toLowerCase()} (up), each as a ratio to main on paired seeds, on log scales${all ? ' shared by every panel' : ''}; main sits where the reference lines cross at ×1, and lower left is cheaper and more accurate. Shape gives the bytes verdict, fill the error verdict; thin lines are each axis's `, val(levelText(m), 'study', 'credible_level'), ' credible interval.');
    $('g3-plane-ctl').replaceChildren(
      el('nav', { class: 'pills', 'aria-label': 'Error measure' }, pillGroup('Error', errs.map((x) => pill(x.short, x.metric === ym.metric, 'y|' + x.metric, () => dash.setParams({ y: x.metric }), x.label)))),
      el('nav', { class: 'pills', 'aria-label': 'Regimes shown' }, pillGroup('Show', [pill('one regime', !all, 'plane|one', () => dash.setParams({ plane: 'one' })), pill('every regime', all, 'plane|all', () => dash.setParams({ plane: 'all' }))])),
      ...(all ? [] : [el('nav', { class: 'pills', 'aria-label': 'Regime' }, ...d3.groups(withData, (g) => g.group).map(([grp, list]) => pillGroup(grp, list.map((g) => pill(g.regime, g.regime === m.regime.regime, 'pr|' + g.regime, () => dash.setParams({ regime: g.regime }), g.description)))))]));
    const shape = (st) => keySvg((g) => g.append('path').attr('class', 'pk').attr('d', d3.symbol(PLANE_SHAPE[st], PLANE_GLYPH)()).attr('transform', `translate(7,7)${st === 'better' ? ' rotate(180)' : ''}`));
    const fill = (st) => keySvg((g) => g.append('path').attr('class', 'pf ' + st).attr('d', d3.symbol(d3.symbolCircle, PLANE_GLYPH)()).attr('transform', 'translate(7,7)'));
    $('g3-plane-key').replaceChildren(el('span', { class: 't-head' }, 'Bytes'), ...[['better', 'fewer'], ['worse', 'more'], ['tie', 'tie'], ['open', 'not settled'], ['one', 'one seed']].map(([st, t]) => el('span', {}, shape(st), t)),
      el('span', { class: 't-head' }, ym.short), ...[['better', 'lower'], ['worse', 'higher'], ['tie', 'tie'], ['open', 'not settled'], ['one', 'one seed']].map(([st, t]) => el('span', {}, fill(st), t)));
    const host = $('g3-plane'); host.replaceChildren();
    let unlabelled = [];
    const shown = all ? withData : withData.filter((g) => g === m.regime);
    const pts = shown.flatMap((g) => m.live.map((a) => pairOf(a, g)).filter(Boolean));
    const dom = { x: fitLog(pts.flatMap((p) => ratioLogs(p.bx))), y: fitLog(pts.flatMap((p) => ratioLogs(p.by))) };
    const xTitle = `${xm.label}, ratio to main →`, yTitle = `↑ ${ym.label}, ratio to main`;
    if (!pts.length) host.append(el('p', { class: 'fail' }, `No ${ym.short} comparisons in ${m.regime.regime} yet. ${withData.length ? 'Choose a regime above.' : ''}`));
    else if (!all) {
      const w = Math.min(m.W, PLANE_MAX_W), h = Math.round(Math.max(PLANE_MIN_H, Math.min(PLANE_MAX_H, w * PLANE_ASPECT)));
      const tint = 'cheaper and more accurate than main';
      unlabelled = drawPlanePanel(m, host, pts, w, h, dom, { xm, ym, labels: true, titles: true, xTitle, yTitle, glyph: PLANE_GLYPH, aria: `${xTitle} against ${yTitle} in ${m.regime.regime}`,
        tintLabel: (G) => ({ x0: G.plot.x0 + 6, x1: G.plot.x0 + 10 + textW(tint, 't-cap'), y0: G.plot.y1 - LINE_H - 4, y1: G.plot.y1 - 2 }) });
    } else {
      const cols = Math.max(1, Math.floor((m.W + PANEL_GAP) / (PANEL_MIN_W + PANEL_GAP))), pw = Math.floor((m.W - (cols - 1) * PANEL_GAP) / cols);
      const grid = el('div', { class: 'mult', style: `grid-template-columns:repeat(${cols}, minmax(0, 1fr))` });
      host.append(grid);
      for (const g of shown) {
        const fig = el('figure', {}, el('figcaption', {}, el('button', { type: 'button', 'aria-pressed': String(g === m.regime), 'data-fk': 'panel|' + g.regime, onclick: () => dash.setParams({ regime: g.regime, plane: 'one' }) }, g.regime), el('span', { class: 't-head' }, g.group)));
        grid.append(fig);
        drawPlanePanel(m, fig, pts.filter((p) => p.g === g), pw, PANEL_H, dom, { xm, ym, labels: false, titles: false, glyph: PLANE_GLYPH * 0.7, aria: `${xm.short} against ${ym.short} in ${g.regime}` });
      }
    }
    // the reference arm sits off the chart, said in words
    const ref = m.reference && shown.map((g) => pairOf(m.reference, g)).filter(Boolean);
    const worst = ref && ref.length ? d3.greatest(ref, (p) => p.by.ratio ?? -Infinity) : null;
    $('g3-plane-edge').replaceChildren(
      ...(unlabelled.length ? [`Too crowded to label here: ${unlabelled.map((p) => rowName(m, p.a)).join(', ')}; hover or tap a mark to name it. `] : []),
      ...(worst ? [`${m.reference.name} is left off so it does not squash the others: it sends no bytes, and its ${ym.short} runs to `, compactNode(worst.by, ym.unit), ` of main (${worst.g.regime}).`] : []));
  };

  /* ---------- Scale beyond the study's regimes ---------- */
  // Columns of the scale table in fixed order: field in scale.json, header, unit (bytes are per pod per second).
  const SCALE_COLS = [
    ['conv_p50_incl_never_ms', 'Convergence p50', 'ms'], ['conv_p99_incl_never_ms', 'Convergence p99', 'ms'],
    ['over_max_pct', 'Over-admission, worst key', '% of limit'], ['stale_limited_p99_pct', 'Staleness p99', '% of limit'],
    ['bytes_total', 'Bytes per pod', 'bytes/s'], ['cross_az_bytes', 'Cross-zone bytes per pod', 'bytes/s'], ['drop_rcvbuf_pkts', 'Receive-buffer drops', 'datagrams'],
  ];
  const SCALE_KIND = [['full', 'Full runs with a burst on one site (80 s; edge-pop 40 s): mean over seeds, with its credible interval where there are several'], ['probe', '12 s probes without the burst, one seed each: compare within this group']];
  const scaleFmt = (unit) => (v) => (unit === 'bytes/s' ? fmtBytes(v) + '/s' : fmtVal(unit)(v));
  const drawScale = (m) => {
    const rows = [...dash.data('scale').data].sort((a, b) => toNum(a.order) - toNum(b.order));
    const at = (kind, c) => rows.find((r) => r.kind === kind && r.case === c);
    const w = (r) => where({ kind: r.kind, case: r.case });
    const cell = (r, [k, , unit]) => {
      const v = toNum(r[k]), lo = toNum(r[k + '_lo']), hi = toNum(r[k + '_hi']), f = scaleFmt(unit);
      if (v === null) return el('td', { class: 'num' }, '—');
      return el('td', { class: 'num' }, val(f(v), 'scale', k, w(r)), lo !== null && hi !== null ? el('span', { class: 'tag' }, val(`[${f(lo)}, ${f(hi)}]`, 'scale', `${k}_lo ${k}_hi`, w(r))) : null);
    };
    const head = el('tr', {}, el('th', {}, 'Regime'), el('th', { class: 'num' }, 'Pods'), el('th', { class: 'num' }, 'Counted req/s'), el('th', { class: 'num' }, 'Req/s per pod'), el('th', { class: 'num' }, 'Seeds'), ...SCALE_COLS.map(([, h]) => el('th', { class: 'num' }, h)));
    const body = SCALE_KIND.flatMap(([kind, label]) => {
      const list = rows.filter((r) => r.kind === kind);
      return list.length ? [el('tr', { class: 'grp' }, el('th', { colspan: String(5 + SCALE_COLS.length), class: 't-cap' }, el('span', {}, label))),
        ...list.map((r) => el('tr', {}, el('th', { title: r.description }, r.case, el('span', { class: 'tag' }, r.description)),
          el('td', { class: 'num' }, val(d3.format(',')(r.pods), 'scale', 'pods', w(r))),
          el('td', { class: 'num' }, val(d3.format(',.0f')(r.counted_rps), 'scale', 'counted_rps', w(r))),
          el('td', { class: 'num' }, d3.format(',.3~r')(r.counted_rps / r.pods)),
          el('td', { class: 'num' }, val(String(r.seeds), 'scale', 'seeds', w(r))),
          ...SCALE_COLS.map((c) => cell(r, c))))] : [];
    });
    $('g3-scale').replaceChildren(el('table', { class: 'tbl scale' }, el('thead', {}, head), el('tbody', {}, ...body)));
    const ms = scaleFmt('ms'), pct = scaleFmt('% of limit');
    const v = (r, k) => (r && toNum(r[k]) !== null ? val(k.endsWith('_ms') ? ms(r[k]) : k.endsWith('_pct') ? pct(r[k]) : scaleFmt('bytes/s')(r[k]), 'scale', k, w(r)) : '—');
    const p183 = at('probe', 'pods-183'), p1k = at('probe', 'pods-1k'), p2k = at('probe', 'pods-2k'), fPeak = at('full', 'prod-peak'), f1k = at('full', 'pods-1k');
    const e208 = at('probe', 'edge-pop'), e8 = at('probe', 'edge-pop-8m'), eFull = at('full', 'edge-pop');
    const pps = (r) => (r ? d3.format(',.3~s')(r.pkts_per_pod_s) + ' datagrams/s' : '—');
    $('g3-scale-note').replaceChildren(
      'The design the study picked (imp-az-hier-nopk) run past the 300-pod autoscaler maximum, with sizes set for each regime. ',
      el('b', {}, 'More pods, same traffic: '), 'prod-peak\'s cluster load spread over more pods slows convergence (p50 ', v(p183, 'conv_p50_incl_never_ms'), ' at 183 pods, ', v(p1k, 'conv_p50_incl_never_ms'), ' at 1,000, ', v(p2k, 'conv_p50_incl_never_ms'),
      ' at 2,000) and raises over-admission under the burst (', v(fPeak, 'over_max_pct'), ' of the limit at prod-peak, ', v(f1k, 'over_max_pct'), ' at 1,000 pods). Each pod then sees under two counted requests a second, its flush threshold sits at its floor of one, and a lone hit waits for the next one or for the 500 ms heartbeat. ',
      'Bytes per pod grow only slowly and cross-zone bytes per pod fall, so the zone hierarchy holds. ',
      el('b', {}, 'Edge PoP: '), '60 pods taking 60,000 counted req/s is metastable. Each pod receives about ', pps(e8), ', some 60 % of the receive model\'s capacity (about 184k datagrams/s at this datagram size). With 8 MiB receive buffers a 12 s probe stayed accurate (p99 ', v(e8, 'conv_p99_incl_never_ms'), '), but the 40 s run tipped into a drop-and-repair loop: ', pps(eFull), ' per pod, p99 ', v(eFull, 'conv_p99_incl_never_ms'), ', over-admission ', v(eFull, 'over_max_pct'),
      ' of the limit. With the kernel\'s 208 KiB default even the probe collapsed (p99 ', v(e208, 'conv_p99_incl_never_ms'), '). A bigger buffer delays the collapse, it does not prevent it; whether the burst set it off is not known, since the runs keep no time series.');
    $('g3-scale-foot').textContent = `In brackets: ${m.study.credible_level * 100} % credible intervals over seeds. Bytes are per pod per second of the measured window. On a phone, scroll the table sideways. Not run: a global edge network (not simulable on one host); 1,000 pods at four times prod-peak\'s load (over 28 GB of memory); the 2,000-pod full run and owner aggregation at these sizes, stopped once the probes and three 1,000-pod seeds had settled the trend.`;
  };

  /* ---------- Method and definitions ---------- */
  const drawMethod = (m) => {
    const lvl = () => val(levelText(m), 'study', 'credible_level'), need = () => val(String(m.study.min_seeds), 'study', 'min_seeds');
    const p = (...k) => el('p', { class: 'note' }, ...k);
    $('g3-method-body').replaceChildren(
      p(el('b', {}, 'Verdicts. '), 'Each arm is compared with main on paired seeds: same seed, same traffic, only the dissemination code differs. The judge gives a ', lvl(), ` credible interval for the geometric-mean ratio arm ÷ main. With tie band r (now ${ropeText(m)}), a cell is better when the whole interval lies below 1/(1 + r), worse when it lies above 1 + r, a tie when it lies inside [1/(1 + r), 1 + r], and not settled otherwise. P(better) is the posterior probability that the arm beats main.`),
      p(el('b', {}, 'Why the intervals are narrow. '), 'The simulator is deterministic given a seed, so the seed is the only source of spread, and pairing by seed cancels most of what the two arms share.'),
      p(el('b', {}, 'Zeros. '), 'Where an arm or main is zero on some seed, the judge works on the difference arm − main instead: better when its interval lies below zero, worse when above; both zero on every seed is a tie. These cells sit in a detached 0 lane (arm zero) or ∞ lane (main zero) rather than on the log axis. Every metric is non-negative, so a displayed interval never extends below 0.'),
      p(el('b', {}, 'Posterior. '), 'Per arm, regime and metric the judge uses a normal likelihood with a Jeffreys prior, cut at the metric\'s rounding noise; when the spread across seeds is above that noise the posterior for the mean is a Student t with n − 1 degrees of freedom. A comparison needs ', need(), ' valid seeds on both sides; with fewer, a cell shows a point and no interval and cannot settle. When every paired seed gives the same ratio, the interval collapses to it.'),
      p(el('b', {}, 'Lower bounds. '), 'Convergence times count a hit that never converges as its remaining life. When more of an arm\'s hits never converge than lie above the quantile (more than half for p50), the quantile is one of those hits: it is drawn with ≥, and its ratio to main is a lower bound too.'),
      p(el('b', {}, 'Order. '), `Rows keep one order everywhere, grouped by design family, and never re-sort when the metric, regime or tie band changes; rank appears only as text. ${m.reference?.name ?? 'The reference arm'} sends nothing: it is the floor for cost and the ceiling for error, and is left out of every count.`));
  };
  const drawStatic = (m) => {
    $('g3-arms').replaceChildren(...d3.groups(m.arms, (a) => a.family).flatMap(([f, list]) => [el('dt', { class: 'fam t-head' }, f), ...list.flatMap((a) => [el('dt', {}, a.name), el('dd', {}, a.mechanism)])]));
    $('g3-regs').replaceChildren(...d3.groups(m.regimes, (g) => g.group).flatMap(([grp, list]) => [el('dt', { class: 'fam t-head' }, grp), ...list.flatMap((g) => [el('dt', {}, g.regime), el('dd', {}, g.description)])]));
  };

  /* ---------- One coalesced draw ---------- */
  const IDS = ['scale', 'posterior', 'seeds', 'runs', 'arms', 'regimes', 'metrics', 'study', 'progress', 'regime_progress', 'verdicts', 'seed_ratios', 'family_tally', 'metric_tally', 'interval_width', 'scorecard', 'main_range', 'solutions', 'self_verdicts', 'self_scorecard'];
  let staticDone = false, raf = 0, lastW = 0, resizeTimer = 0;
  const draw = () => {
    raf = 0;
    const states = IDS.map((id) => dash.data(id).status);
    if (states.includes('error')) { $('g3-status').replaceChildren(el('span', { class: 'fail' }, 'The study data failed to load, so nothing on this page can be drawn. Reload the page; if it persists, check the dashboard\'s data sources.')); return; }
    if (states.some((s) => s !== 'ok')) return;
    const fk = document.activeElement?.closest?.('[data-fk]')?.dataset.fk;
    const m = model(); m0 = m; lastW = m.W;
    if (!staticDone) { drawStatic(m); staticDone = true; }
    drawHeader(m); drawScore(m); drawHub(m, fk); drawSuper(m, fk); drawPlane(m); drawScale(m); drawMethod(m);
    if (fk) { const n = root.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (n && n !== document.activeElement) n.focus({ preventScroll: true }); }
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(draw); };
  dash.onData(schedule);
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (root.clientWidth !== lastW) schedule(); }, RESIZE_DEBOUNCE_MS); }).observe(root);
  document.fonts?.ready.then(() => { widths.clear(); schedule(); });
  setInterval(() => { const n = $('g3-age'), a = ageSpan(); if (n && a) n.replaceChildren(a); }, AGE_REFRESH_MS);
})();
</script>
</div>
</body>
</html>
