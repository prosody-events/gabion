# cargo-rail change-impact configuration.
#
# Built-in Cargo work (`cargo.fmt`, `cargo.clippy`, `cargo.test`, …) is
# computed automatically from the Cargo graph and the touched files.
# The repository work below feeds the job gating in
# `.github/workflows/*.yml`: `cargo-rail-action` lists every required
# work ID in its `required-work` output, and each job checks for its own
# work ID or `ci`.
#
# Plan jobs pass `all` on every non-pull_request event (push to main,
# schedule, manual dispatch), so gating only ever shrinks PR feedback —
# never the main or release path.

[plan.work.ci]
scope = "repository"
paths = [
    ".github/**",
    "Makefile",
    "rail.toml",
    "release-please-config.json",
    ".release-please-manifest.json",
]

[plan.work.nginx-smoke]
scope = "repository"
paths = [
    "deploy/nginx/**",
    "crates/nginx/**",
    "crates/gabion/src/wire/**",
]

[plan.work.kube-smoke]
scope = "repository"
paths = [
    "deploy/kubernetes/**",
    "deploy/nginx/**",
    "deploy/gabiond/**",
    "crates/gabion/src/discovery/**",
    "crates/server/**",
    "crates/nginx/**",
    "Cargo.toml",
    "Cargo.lock",
]

[plan.work.wasm-viz]
scope = "repository"
paths = [
    "crates/gabion-wasm/**",
    "crates/gabion/src/**",
]
