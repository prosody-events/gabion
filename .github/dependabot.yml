version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /crates/gabion-wasm/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Every base image is pinned `tag@sha256:digest`; for a non-version tag
  # (`stable-alpine`, `jammy`, …) Dependabot keeps the tag and bumps the
  # digest. One grouped PR per week keeps an upstream rebuild to one CI
  # run.
  - package-ecosystem: docker
    directories:
      - /deploy/gabiond
      - /deploy/kubernetes
      - /deploy/nginx
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      base-images:
        patterns: ['*']
