name: wasm

on:
  pull_request:
  push:
    branches: [main]

# Sequence pages deploys (cancel-in-progress: false) so a deploy already in
# flight always finishes before the next one begins — Pages refuses
# overlapping deploys.
concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v7
      - uses: loadingalias/cargo-rail-action@fd41439dfa862939e6928cb98d7e76de580f673c # v12.0.0
        id: rail
        with:
          all: true

  build:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'wasm-viz') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # The release wasm build (web/package.json `build:wasm`) recompiles
      # std with `-Zbuild-std` for size — that needs nightly's `rust-src`.
      # Installed last, nightly is the default toolchain rust-cache keys
      # on, which is right: `build:wasm` is the expensive, nightly-compiled
      # half of this cache. It saves on PRs too, for the same reason as
      # safety.yml's Miri jobs — the key moves whenever nightly does.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Pin the wasm-pack version: the action's `latest` resolver is
          # broken and pulls the 2019-era v0.9.1, which predates Cargo
          # workspace inheritance and chokes on `license.workspace = true`
          # in `crates/gabion-wasm/Cargo.toml`. v0.12.0+ understands the
          # `[workspace.package]` indirection.
          version: 'v0.15.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # `crates/gabion-wasm/web/pnpm-workspace.yaml` uses pnpm 11's
          # `allowBuilds:` build-allowlist key — pnpm 9 doesn't recognise
          # it and errors out with "packages field missing or empty".
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/gabion-wasm/web/pnpm-lock.yaml

      - name: cross-compile gabion-wasm
        run: rustup run stable cargo check --target wasm32-unknown-unknown -p gabion-wasm
      # Native `gabion-wasm` engine + shim tests are covered by
      # `check.yml`'s `make unit` (`cargo nextest run --workspace`), so we
      # don't re-run them here — this job keeps only the wasm-unique work
      # (the wasm32 cross-compile above and the browser smoke below).

      - name: install web deps
        working-directory: crates/gabion-wasm/web
        run: pnpm install --frozen-lockfile
      # The Playwright smoke runs `vite preview` at root, so the smoke
      # build must use base `/`. Don't set VITE_BASE here — vite.config.ts
      # defaults to `/`.
      - name: build visualizer for smoke
        working-directory: crates/gabion-wasm/web
        run: pnpm run build

      # Cache the chromium browser binary (~/.cache/ms-playwright), keyed
      # on the pnpm lockfile so it re-downloads only when the pinned
      # @playwright/test version moves. Restore and save are split so only
      # `main` writes the ~280 MB entry; PRs restore main's. The OS-level
      # deps installed by `install-deps` below land in root-owned system
      # paths and aren't cacheable, so that step always runs.
      - name: restore Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crates/gabion-wasm/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        working-directory: crates/gabion-wasm/web
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            pnpm exec playwright install chromium
          fi
          pnpm exec playwright install-deps chromium
      - name: save Playwright browser
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: in-browser screenshot smoke
        working-directory: crates/gabion-wasm/web
        run: pnpm run screenshot

      # Rebuild with VITE_BASE=/gabion/ so the deployed `index.html` and
      # the wasm bundle's asset URLs resolve under the project-pages
      # subpath. Cheap: the wasm-pack output and the Svelte bundle are
      # already in cache from the smoke build.
      - name: build visualizer for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          VITE_BASE: /gabion/
        working-directory: crates/gabion-wasm/web
        run: pnpm run build

      # Hand the built site to the deploy-pages job on main pushes.
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: pages
          path: crates/gabion-wasm/web/dist
          if-no-files-found: error

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pages
          path: dist
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
