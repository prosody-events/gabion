name: safety

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Miri pass on `main` — guards against nightly toolchain
    # regressions in Miri itself, not just our own code.
    - cron: '0 7 * * 1'

concurrency:
  group: safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v7
      - uses: loadingalias/cargo-rail-action@fd41439dfa862939e6928cb98d7e76de580f673c # v12.0.0
        id: rail
        with:
          all: true

  # Together these jobs cover everything `make miri-all` runs locally —
  # split by suite and borrow model for parallelism, so a failure points at
  # the mode that broke. The FFI alignment suites take seconds, so they
  # ride along with the matching safety job instead of paying for a runner.
  miri-safety:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri,rust-src
      # All four Miri jobs compile the same crate graph and sysroot —
      # MIRIFLAGS only steers the interpreter, not rustc — so they share
      # one cache entry instead of keeping four copies per ref. Every job
      # may save it: the first to succeed writes the entry, so one failing
      # suite can't leave the rest cold. Unlike the stable jobs these save
      # on PRs too: the key embeds the nightly rustc hash, so main's entry
      # goes stale whenever nightly moves, and a PR's own entry is what
      # keeps its follow-up pushes warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri
          # miri builds its sysroot into ~/.cache/miri (MIRI_SYSROOT is
          # unset), outside the paths rust-cache captures by default —
          # without this it rebuilds the sysroot cold every run.
          cache-directories: ~/.cache/miri
      # Prebuilt nextest — cargo-install compiles it from source on a
      # cache miss; install-action fetches the release binary.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: make miri-safety miri-ffi-alignment

  miri-safety-tb:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri
          # See miri-safety: shared entry, and the sysroot in ~/.cache/miri
          # isn't captured by default.
          cache-directories: ~/.cache/miri
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: make miri-safety-tb miri-ffi-alignment-tb

  miri-lib:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri
          # See miri-safety: shared entry, and the sysroot in ~/.cache/miri
          # isn't captured by default.
          cache-directories: ~/.cache/miri
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: make miri-lib

  # The Tree-Borrows half of `make miri-all` beyond the three Stacked-Borrows
  # passes above. The Makefile doesn't expose this as a standalone target, so
  # invoke the same command directly.
  miri-lib-tb:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    env:
      # `-Zmiri-disable-isolation` matches what `make miri-lib` sets —
      # the identity tests need a real-time clock, which miri refuses
      # under default isolation. Tree Borrows is independent of that.
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri
          # See miri-safety: shared entry, and the sysroot in ~/.cache/miri
          # isn't captured by default.
          cache-directories: ~/.cache/miri
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - run: rustup run nightly cargo miri nextest run --no-fail-fast -p gabion-nginx --lib
