name: check

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs of this workflow on the same ref (PR head, branch).
# Push to main is never cancelled — main coverage is load-bearing.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required-work: ${{ steps.rail.outputs.required-work }}
    steps:
      - uses: actions/checkout@v7
      - uses: loadingalias/cargo-rail-action@fd41439dfa862939e6928cb98d7e76de580f673c # v12.0.0
        id: rail
        with:
          all: true

  fmt:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.fmt') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      # No rust-cache here: `make fmt` only runs rustfmt, which compiles
      # nothing — a cache restore/save would be pure overhead.
      - run: make fmt

  clippy:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.clippy') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # Only `main` saves. PRs restore main's entry (a PR ref can read its
      # base branch's caches) — per-PR saves only churned the repo's 10 GiB
      # Actions cache and LRU-evicted main's entries. With
      # CARGO_INCREMENTAL=0 and rust-cache pruning workspace crates, a PR's
      # own entry only ever helped PRs that change dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make clippy

  test:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt nextest binary — `cargo-install` compiles it from source
      # on a cache miss (minutes); `install-action` fetches the release.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      # `make unit` covers the full workspace; the `gabion-nginx` `safety`
      # integration test runs as part of that.
      - run: make unit
      - run: make loom

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make hygiene

  # Gate on `cargo.test`, not `cargo.build`: cargo-rail attributes bench
  # targets to the test work, so a bench-only change skips `cargo.build`.
  bench-check:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.required-work), 'cargo.test') ||
      contains(fromJSON(needs.plan.outputs.required-work), 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make bench-check
