name: check

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs of this workflow on the same ref (PR head, branch).
# Push to main is never cancelled — main coverage is load-bearing.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build:       ${{ steps.rail.outputs.build }}
      test:        ${{ steps.rail.outputs.test }}
      bench:       ${{ steps.rail.outputs.bench }}
      docs:        ${{ steps.rail.outputs.docs }}
      infra:       ${{ steps.rail.outputs.infra }}
      scope-json:  ${{ steps.rail.outputs.scope-json }}
      base-ref:    ${{ steps.rail.outputs.base-ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: loadingalias/cargo-rail-action@95875a43ad5583b4d6a1dc65630afb0c2ecb6b30 # v4.1.3
        id: rail
        with:
          mode: minimal

  fmt:
    needs: plan
    if: needs.plan.outputs.build == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      # No rust-cache here: `make fmt` only runs rustfmt, which compiles
      # nothing — a cache restore/save would be pure overhead.
      - run: make fmt

  clippy:
    needs: plan
    if: needs.plan.outputs.build == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # Only `main` saves. PRs restore main's entry (a PR ref can read its
      # base branch's caches) — per-PR saves only churned the repo's 10 GiB
      # Actions cache and LRU-evicted main's entries. With
      # CARGO_INCREMENTAL=0 and rust-cache pruning workspace crates, a PR's
      # own entry only ever helped PRs that change dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make clippy

  test:
    needs: plan
    if: needs.plan.outputs.test == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt nextest binary — `cargo-install` compiles it from source
      # on a cache miss (minutes); `install-action` fetches the release.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # `make unit` covers the full workspace; the `gabion-nginx` `safety`
      # integration test runs as part of that.
      - run: make unit

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make hygiene

  bench-check:
    needs: plan
    if: needs.plan.outputs.bench == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make bench-check
