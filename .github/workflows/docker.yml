name: docker

on:
  pull_request:
    # PRs that don't touch any image input skip the workflow — docs-only
    # / test-only PRs don't need to burn registry quota. The `pr-build`
    # job below pushes per-PR images for reviewer testing; the full
    # build matrix + combine stage are gated to non-PR runs.
    paths:
      - 'crates/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    # Manually pushed tags only: release-please's tags are pushed with
    # GITHUB_TOKEN, which starts no workflows, so release-please.yml
    # dispatches this workflow on the tag instead.
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Per-PR concurrency: a second push to the same PR cancels the
  # in-flight build (its tags would be stomped anyway). Main / tag
  # runs stay un-cancelled — every release tag deserves a full run.
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # PRs reach this workflow only through the `paths:` filter above, so it
  # has no need for cargo-rail's PR-skip gate.
  # The plan job here exists solely to resolve the gabion version once
  # and hand it to every build / combine job below — release tag wins,
  # otherwise we read `.release-please-manifest.json`.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref-tag: ${{ steps.version.outputs.ref-tag }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "ref-tag=v$version" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            version="$(jq -r '."."' .release-please-manifest.json)"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "ref-tag=main" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  # PR builds: amd64-only, default flavors only. Pushed with two tags:
  #   - `pr-<N>-<short-sha>` — immutable, one per commit
  #   - `pr-<N>`             — moving, points at the PR's latest head
  # Both are prefixed `pr-` so the cleanup workflow can find and prune
  # them on PR close or by age. Fork PRs skip — GITHUB_TOKEN doesn't
  # carry `packages:write` for forks; a fork would 401 at login.
  pr-build:
    if: |
      github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # `flavor` mirrors the default flavor each image builds under in
          # the `build` matrix, so `cache-from` can read that job's
          # canonical cook layer (see the build-push step below).
          - image: gabiond
            dockerfile: deploy/gabiond/Dockerfile
            base-arg: ''
            flavor: default
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            base-arg: NGINX_BASE
            flavor: stable-alpine
          # openresty's default (alpine) flavor. It was previously
          # excluded over a `cargo chef cook` OOM (exit 139) blamed on a
          # "7 GB" ubuntu-latest runner under fat LTO + 1 codegen unit —
          # but hosted runners have been 16 GB since 2024, and openresty
          # amd64 already builds in the main `build` matrix on this same
          # runner, so the exclusion is being re-tested here. Non-default
          # openresty flavors + multi-arch still build only on
          # main/tags.
          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            base-arg: OPENRESTY_BASE
            flavor: alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          short_sha="${HEAD_SHA:0:7}"
          {
            printf 'tags<<EOF\n'
            printf '%s:pr-%s\n' "$IMAGE_REPO" "$PR"
            printf '%s:pr-%s-%s\n' "$IMAGE_REPO" "$PR" "$short_sha"
            printf 'EOF\n'
            printf 'short-sha=%s\n' "$short_sha"
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.base-arg != '' && format('{0}={1}', matrix.base-arg, matrix.flavor) || '' }}
          # Registry-backed cache on GHCR — not the Actions cache, whose
          # hard 10 GiB per-repo cap these `mode=max` blobs were blowing
          # past, so entries were LRU-evicted before they could be reused.
          # Registry cache counts against package storage instead.
          # `image-manifest=true,oci-mediatypes=true` is mandatory: without
          # it GHCR rejects the cache manifest mediatype and the export
          # silently no-ops.
          #
          # `cache-from` reads two scopes: the PR's own scope first, then
          # the canonical `build`-job scope read-only. Content-addressed
          # layers can't poison — a layer is served only on exact
          # input-hash match — so the second source just lets a fresh PR
          # warm its cook layer from main's last build instead of
          # compiling dependencies cold. `cache-to` writes only the PR
          # scope, so a PR build never mutates the release scope.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-pr-${{ matrix.image }}-amd64
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-${{ matrix.image }}-${{ matrix.flavor }}-amd64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-pr-${{ matrix.image }}-amd64,mode=max,image-manifest=true,oci-mediatypes=true
          # Skip provenance + sbom on PRs — they're for releases, and
          # they bloat per-PR registry churn the cleanup has to sweep.
          provenance: false
          sbom: false

  # One sticky comment per PR with the resolved `docker pull` lines.
  # Re-runs on every commit overwrite the comment in place rather than
  # piling up — the header field makes it idempotent.
  pr-comment:
    if: |
      github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
    needs: pr-build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: docker-pr-images
          message: |
            ### Docker images for this PR

            Pull a moving tag (latest commit on this PR):

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gabiond:pr-${{ github.event.pull_request.number }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/nginx:pr-${{ github.event.pull_request.number }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/openresty:pr-${{ github.event.pull_request.number }}
            ```

            Or pin to this exact commit (`${{ github.event.pull_request.head.sha }}`):

            ```sh
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gabiond:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
            ```

            `linux/amd64` + default flavors only on PRs; multi-arch + non-default flavors build on `main`. Tags are auto-pruned when this PR closes (or after 30 days, whichever comes first).

  # Stage 1: one job per (image × flavor × arch). Each job builds a
  # single-platform image, pushes it to GHCR by digest, and uploads the
  # digest as an artifact for the manifest-combine job.
  build:
    if: github.event_name != 'pull_request'
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # `flavor` names the Dockerfile's digest-pinned base stage that
          # the `base-arg` build-arg selects.
          # gabiond — single flavor.
          - image: gabiond
            dockerfile: deploy/gabiond/Dockerfile
            flavor: default
            base-arg: ''
            arch: amd64
            runner: ubuntu-latest
          - image: gabiond
            dockerfile: deploy/gabiond/Dockerfile
            flavor: default
            base-arg: ''
            arch: arm64
            runner: ubuntu-24.04-arm

          # nginx — six flavors from four builds. Docker's `alpine` /
          # `latest` tags always alias `mainline-alpine` / `mainline`, so
          # `combine` publishes the `-alpine` / `-debian` tags from those
          # builds: its `flavor-suffix` is a list.
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: stable-alpine
            base-arg: NGINX_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: stable-alpine
            base-arg: NGINX_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: mainline-alpine
            base-arg: NGINX_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: mainline-alpine
            base-arg: NGINX_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: stable
            base-arg: NGINX_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: stable
            base-arg: NGINX_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: mainline
            base-arg: NGINX_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
            flavor: mainline
            base-arg: NGINX_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          # openresty — three flavors. Default (no suffix) is alpine.
          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: alpine
            base-arg: OPENRESTY_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: alpine
            base-arg: OPENRESTY_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: jammy
            base-arg: OPENRESTY_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: jammy
            base-arg: OPENRESTY_BASE
            arch: arm64
            runner: ubuntu-24.04-arm

          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: bookworm
            base-arg: OPENRESTY_BASE
            arch: amd64
            runner: ubuntu-latest
          - image: openresty
            dockerfile: deploy/nginx/Dockerfile.openresty
            flavor: bookworm
            base-arg: OPENRESTY_BASE
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ${{ matrix.base-arg != '' && format('{0}={1}', matrix.base-arg, matrix.flavor) || '' }}
          # `mode=max` exports every layer (not just the final), which is
          # what makes cargo-chef shine — the recipe-frozen build layer is
          # what we want to skip on re-runs. Scope per (image,flavor,arch)
          # so an amd64 layer never tries to satisfy an arm64 build.
          #
          # Registry-backed on GHCR, not the Actions cache: at `mode=max`
          # these blobs ran ~10 GiB and were continuously LRU-evicted
          # under GitHub's 10 GiB per-repo Actions cap before reuse.
          # Registry cache counts against package storage instead.
          # `image-manifest=true,oci-mediatypes=true` is mandatory —
          # without it GHCR rejects the cache manifest mediatype and the
          # export silently no-ops.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-${{ matrix.image }}-${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache-${{ matrix.image }}-${{ matrix.flavor }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          # `mode=max` provenance records the full build graph in the
          # image's OCI index; the signed attestation is issued in
          # `combine`, against the published index. Both, plus the SBOM,
          # are gated to release builds (`is-release`) — `:main-<sha>` dev
          # images skip them (they bloat per-commit registry churn and
          # aren't pinned by users). Anything users pin to keeps its
          # attestation.
          provenance: ${{ needs.plan.outputs.is-release == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.plan.outputs.is-release == 'true' }}
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      # Resolve the upstream nginx/openresty version baked into the image
      # just built, whose base is the flavor's digest-pinned stage. nginx
      # exposes NGINX_VERSION as a runtime env var; openresty doesn't
      # expose RESTY_VERSION, so parse `nginx -v`'s output instead.
      - id: resolve
        if: matrix.base-arg != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          docker pull --platform="linux/${ARCH}" "$IMAGE"
          if [[ "${{ matrix.image }}" == "nginx" ]]; then
            ver=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" \
              | sed -n 's/^NGINX_VERSION=//p' \
              | head -n1)
            echo "upstream-tag=nginx${ver}" >> "$GITHUB_OUTPUT"
            echo "upstream-version=${ver}" >> "$GITHUB_OUTPUT"
          else
            ver=$(docker run --rm --platform="linux/${ARCH}" --entrypoint sh "$IMAGE" \
              -c '/usr/local/openresty/nginx/sbin/nginx -v 2>&1' \
              | sed -n 's|^nginx version: openresty/\([0-9.]*\).*|\1|p')
            echo "upstream-tag=openresty${ver}" >> "$GITHUB_OUTPUT"
            echo "upstream-version=${ver}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: capture digest
        run: |
          set -eu
          mkdir -p /tmp/digests
          # `name | flavor | upstream-tag` carry to the combine stage.
          # The arch is encoded in the artifact name itself.
          name='${{ matrix.image }}'
          flavor='${{ matrix.flavor }}'
          digest='${{ steps.build.outputs.digest }}'
          upstream='${{ steps.resolve.outputs.upstream-tag || '' }}'
          printf '%s\n' "$digest" > "/tmp/digests/digest"
          printf '%s\n' "$upstream" > "/tmp/digests/upstream"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stage 2: one job per (image × flavor). Pull both arch digests,
  # `docker buildx imagetools create` a multi-arch manifest under every
  # tag the scheme says we should publish.
  combine:
    if: github.event_name != 'pull_request'
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gabiond
            flavor: default
            flavor-suffix: ''
            kind: app
          - image: nginx
            flavor: stable-alpine
            flavor-suffix: ''
            kind: nginx
          - image: nginx
            flavor: mainline-alpine
            flavor-suffix: mainline-alpine alpine
            kind: nginx
          - image: nginx
            flavor: stable
            flavor-suffix: stable
            kind: nginx
          - image: nginx
            flavor: mainline
            flavor-suffix: mainline debian
            kind: nginx
          - image: openresty
            flavor: alpine
            flavor-suffix: ''
            kind: nginx
          - image: openresty
            flavor: jammy
            flavor-suffix: jammy
            kind: nginx
          - image: openresty
            flavor: bookworm
            flavor-suffix: bookworm
            kind: nginx
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image }}-${{ matrix.flavor }}-amd64
          path: /tmp/digests/amd64
      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.image }}-${{ matrix.flavor }}-arm64
          path: /tmp/digests/arm64

      - id: assemble
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF_TAG: ${{ needs.plan.outputs.ref-tag }}
          IS_RELEASE: ${{ needs.plan.outputs.is-release }}
          FLAVOR_SUFFIX: ${{ matrix.flavor-suffix }}
          KIND: ${{ matrix.kind }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          amd64_digest="$(cat /tmp/digests/amd64/digest)"
          arm64_digest="$(cat /tmp/digests/arm64/digest)"
          upstream="$(cat /tmp/digests/amd64/upstream)"

          tags=()
          short_sha="${SHA:0:7}"

          # On release, also publish floating `:MAJOR` and `:MAJOR.MINOR`
          # tags so users can pin to a release line and get patches
          # automatically. These intentionally drop the `v` prefix — only
          # the immutable `:vX.Y.Z` keeps it.
          major=""
          major_minor=""
          if [[ "$IS_RELEASE" == "true" ]]; then
            major="${VERSION%%.*}"      # 0.2.0 -> 0
            major_minor="${VERSION%.*}" # 0.2.0 -> 0.2
          fi

          # `app` images (gabiond) only ever carry version and ref-tag —
          # no flavor and no upstream-version axis. `nginx`-shaped images
          # (nginx, openresty) layer the resolved upstream version onto
          # the same set.
          #
          # Non-release (main pushes) is split for the two kinds: `app`
          # keeps `:main-<sha>` as its immutable per-commit pin (no
          # upstream axis to track). `nginx`-shaped images pin instead to
          # the upstream-qualified `:main-<sha>-<upstream>` form, so the
          # pin names the upstream patch it carries.
          if [[ "$KIND" == "app" ]]; then
            if [[ "$IS_RELEASE" == "true" ]]; then
              tags+=("${IMAGE_REPO}:${REF_TAG}")
              tags+=("${IMAGE_REPO}:latest")
              tags+=("${IMAGE_REPO}:${major}")
              tags+=("${IMAGE_REPO}:${major_minor}")
            else
              tags+=("${IMAGE_REPO}:main-${short_sha}")
              tags+=("${IMAGE_REPO}:main")
            fi
          else
            if [[ -z "$FLAVOR_SUFFIX" ]]; then
              if [[ "$IS_RELEASE" == "true" ]]; then
                tags+=("${IMAGE_REPO}:${REF_TAG}")
                tags+=("${IMAGE_REPO}:${REF_TAG}-${upstream}")
                tags+=("${IMAGE_REPO}:latest")
                tags+=("${IMAGE_REPO}:${upstream}")
                tags+=("${IMAGE_REPO}:${major}")
                tags+=("${IMAGE_REPO}:${major}-${upstream}")
                tags+=("${IMAGE_REPO}:${major_minor}")
                tags+=("${IMAGE_REPO}:${major_minor}-${upstream}")
              else
                tags+=("${IMAGE_REPO}:main")
                tags+=("${IMAGE_REPO}:${upstream}-main")
                tags+=("${IMAGE_REPO}:main-${short_sha}-${upstream}")
              fi
            else
              for sfx in $FLAVOR_SUFFIX; do
                if [[ "$IS_RELEASE" == "true" ]]; then
                  tags+=("${IMAGE_REPO}:${REF_TAG}-${sfx}")
                  tags+=("${IMAGE_REPO}:${REF_TAG}-${upstream}-${sfx}")
                  tags+=("${IMAGE_REPO}:latest-${sfx}")
                  tags+=("${IMAGE_REPO}:${upstream}-${sfx}")
                  tags+=("${IMAGE_REPO}:${major}-${sfx}")
                  tags+=("${IMAGE_REPO}:${major}-${upstream}-${sfx}")
                  tags+=("${IMAGE_REPO}:${major_minor}-${sfx}")
                  tags+=("${IMAGE_REPO}:${major_minor}-${upstream}-${sfx}")
                else
                  tags+=("${IMAGE_REPO}:main-${sfx}")
                  tags+=("${IMAGE_REPO}:${upstream}-main-${sfx}")
                  tags+=("${IMAGE_REPO}:main-${short_sha}-${upstream}-${sfx}")
                fi
              done
            fi
          fi

          # Emit one `--tag` per resolved tag plus the two source digests.
          args=()
          for t in "${tags[@]}"; do
            args+=("--tag" "$t")
          done
          args+=("${IMAGE_REPO}@${amd64_digest}" "${IMAGE_REPO}@${arm64_digest}")
          printf '%s\n' "${tags[@]}"
          docker buildx imagetools create "${args[@]}"
          # Every tag above resolves to this one multi-arch index, so it is
          # the digest `gh attestation verify oci://<image>:<tag>` looks up.
          digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        shell: bash

      # Signed SLSA-style provenance for the published index. The Sigstore
      # signature is keyless — issued against the workflow run's OIDC
      # identity. No secret to rotate.
      - uses: actions/attest-build-provenance@v4
        # Release-only, matching the in-image provenance/sbom gating.
        if: needs.plan.outputs.is-release == 'true'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.assemble.outputs.digest }}
          push-to-registry: true
