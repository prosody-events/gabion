[package]
name = "gabion-nginx"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
arrayvec.workspace = true
futures.workspace = true
gabion.workspace = true
humantime.workspace = true
# The `loom` feature swaps the SHM atomics for loom's; `make loom` only.
loom = { workspace = true, optional = true }
nginx-sys = { workspace = true, optional = true }
ngx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
twox-hash.workspace = true
whoami.workspace = true

[features]
default = []
ngx-module = ["dep:nginx-sys", "dep:ngx", "ngx/async", "export-modules"]
export-modules = []

[[bin]]
name = "nginx_layout"
required-features = ["ngx-module"]

[dev-dependencies]
criterion.workspace = true
quickcheck.workspace = true
quickcheck_macros.workspace = true

[[bench]]
name = "aggregate"
harness = false
