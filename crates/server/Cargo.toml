[package]
name = "gabion-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
axum.workspace = true
config.workspace = true
envoy-types.workspace = true
futures.workspace = true
gabion = { workspace = true, features = ["serde"] }
humantime-serde.workspace = true
serde.workspace = true
thiserror.workspace = true
# Host-only drivers the workspace base no longer carries: TCP/UDP sockets,
# the multi-threaded runtime (tests), and Unix signal handling for gabiond.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace = true
gabion-nginx.workspace = true
quickcheck.workspace = true
quickcheck_macros.workspace = true
serde_json.workspace = true
tower.workspace = true

[[bench]]
name = "admission"
harness = false
